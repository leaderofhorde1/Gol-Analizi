name: Android Uygulaması

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gol-sinyali.apk
          gh release create "app-v${{ github.run_number }}" gol-sinyali.apk \
            --title "Gol Sinyali 1.${{ github.run_number }}" \
            --notes "Telefonda bu sayfadan gol-sinyali.apk dosyasını indirip kurun." --latest
