name: Gol Sinyali

on:
  schedule:
    # Her gün 18:00 (Türkiye saati) = 15:00 UTC. GitHub birkaç dakika geç başlatabilir.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "test = bağlantıları dene, run = canlı takibi şimdi başlat"
        type: choice
        options: [test, run]
        default: test

permissions:
  contents: write

concurrency:
  group: gol-sinyali
  cancel-in-progress: false

jobs:
  sinyal:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıkları kur
        run: |
          pip install requests
          npm install -g @anthropic-ai/claude-code

      - name: Gol sinyali motoru
        env:
          MODE: ${{ github.event.inputs.mod || 'run' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WINDOW_END: "23:45"     # takibin biteceği saat (TR)
          MAX_TRACK: "3"          # günde takip edilecek maç sayısı (ücretsiz kota için 3)
          THRESHOLD: "13"         # baskı eşiği: büyütürsen daha az ama daha güçlü sinyal
          CLAUDE_MODEL: "sonnet"
          MAX_CLAUDE_CALLS: "40"
        run: python src/main.py

      - name: Sinyal kayıtlarını depoya kaydet
        if: always()
        run: |
          git config user.name "gol-sinyali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if ! git diff --cached --quiet; then
            git commit -m "Veri: $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
