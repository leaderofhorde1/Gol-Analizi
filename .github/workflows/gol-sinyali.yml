name: Gol Sinyali

on:
  schedule:
    # Sistem 7/24 çalışır; oturumlar birbirini zincirle başlatır. Aşağıdakiler yedek tetikleyicidir (UTC).
    # GitHub zamanlayıcısı birkaç dakika geç başlatabilir.
    # Oturumlar birbirini zincirleme başlatır; bunlar sadece yedek tetikleyicidir.
    # Bir oturum sürerken tetiklenirse sıraya girer, fazlası GitHub tarafından iptal edilir.
    - cron: "0 7 * * *"
    - cron: "30 7 * * *"
    - cron: "15 8 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
    - cron: "10 0 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "test = bağlantıları dene, run = canlı takibi başlat, kisa = 6 dk deneme + sabah raporu, diag = teşhis"
        type: choice
        options: [test, run, kisa, diag, kurtar, mac, soru, kapsam, basket]
        default: test
      sure:
        description: "İsteğe bağlı: oturum süresi (dakika). Boş = varsayılan"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  # test ve teşhis, süren canlı oturumu beklemesin
  group: gol-sinyali-${{ (github.event.inputs.mod == 'test' || github.event.inputs.mod == 'diag' || github.event.inputs.mod == 'kurtar' || github.event.inputs.mod == 'mac' || github.event.inputs.mod == 'soru' || github.event.inputs.mod == 'kapsam' || github.event.inputs.mod == 'basket') && 'kontrol' || 'canli' }}
  cancel-in-progress: false

jobs:
  sinyal:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: En güncel kod ve veri
        # Sırada bekleyip geç başlayan oturum, tetiklendiği andaki eski kod/veriyle değil en güncel haliyle çalışır
        run: |
          git fetch -q origin main
          git checkout -q -B main origin/main
          git log -1 --format="Kod: %h %ci %s"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıkları kur
        run: |
          pip install requests
          npm install -g @anthropic-ai/claude-code

      - name: Gol sinyali motoru
        env:
          MODE: ${{ github.event.inputs.mod == 'kisa' && 'run' || github.event.inputs.mod || 'run' }}
          FORCE_REPORT: ${{ github.event.inputs.mod == 'kisa' && '1' || '0' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WINDOW_END: "23:45"     # ücretsiz planda takibin biteceği saat (TR)
          RUN_MINUTES: ${{ (github.event.inputs.mod != 'soru' && github.event.inputs.sure) || (github.event.inputs.mod == 'kisa' && '6') || '350' }}  # bir oturumun süresi (dk)
          SORU_METNI: ${{ github.event.inputs.sure }}  # soru modunda sorulacak metin
          INTERVAL: "30"          # Pro/Ultra: tur aralığı (sn)
          SIGNALS: "gol,alt,korner,kart,iy,kg,baski"  # gol = maç sonu Üst, alt = maç sonu Alt, iy = ilk yarı gol, kg = karşılıklı gol, baski = baskı alarmı
          EDGE_IY: "0.05"         # ilk yarı gol için model-piyasa farkı
          EDGE_KG: "0.06"         # KG Var için model-piyasa farkı
          EDGE: "0.04"            # baskı alarmı notu için 10 dk gol farkı
          EDGE_UST: "0.05"        # maç sonu Üst: model-piyasa farkı
          EDGE_ALT: "0.06"        # maç sonu Alt: model-piyasa farkı
          EDGE_CORNER: "0.07"     # korner için aynı fark
          EDGE_CARD: "0.07"       # kart için aynı fark
          ALERT_DROP_PCT: "0.12"  # oran düşüşü uyarısı eşiği (%12)
          MAX_TRACK: "3"          # günde takip edilecek maç sayısı (ücretsiz kota için 3)
          THRESHOLD: "13"         # baskı eşiği: büyütürsen daha az ama daha güçlü sinyal
          CLAUDE_MODEL: "sonnet"
          MAX_CLAUDE_CALLS: "100"  # oturum başına en fazla Claude çağrısı (akşam yoğunluğunda 25 yetmiyordu)
        run: python src/main.py

      - name: Sinyal kayıtlarını depoya kaydet
        if: always()
        run: |
          git config user.name "gol-sinyali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data; [ -d docs ] && git add -A docs || true
          if ! git diff --cached --quiet; then
            git commit -m "Veri: $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi

      - name: Sonraki oturumu başlat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/zincir ]; then
            gh workflow run gol-sinyali.yml --ref main -f mod=run && echo "Sonraki oturum başlatıldı"
          fi
