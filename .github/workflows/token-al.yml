name: Token Al (gecici)

on:
  push:
    paths: [".token/start"]

permissions:
  contents: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: setup-token
        shell: bash
        run: |
          set -u
          git config user.name "gol-sinyali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkfifo /tmp/in
          (sleep 1500 > /tmp/in &)
          script -q -f -c "stty cols 400 rows 50; claude setup-token" /tmp/out.log < /tmp/in > /dev/null 2>&1 &
          clean() { sed 's/\x1b\][^\x07]*\x07//g; s/\x1b\]8;[^;]*;//g; s/\x1b\[[0-9;?]*[a-zA-Z]//g' /tmp/out.log | tr -d '\n\r'; }
          URL=""
          for i in $(seq 1 60); do
            sleep 2
            URL=$(clean | grep -o 'https://claude.com/cai/oauth/authorize[^ ]*' | head -1 | sed 's/\]8;;.*//; s/Paste.*//; s/╭.*//')
            [ -n "$URL" ] && break
          done
          [ -z "$URL" ] && { echo "URL bulunamadi"; exit 1; }
          echo "$URL" > .token/url.txt
          git add .token/url.txt && git commit -qm "token: url" && git push -q
          echo "URL yayinlandi, kod bekleniyor"
          for i in $(seq 1 120); do
            sleep 8
            git pull -q --rebase || true
            [ -f .token/code.txt ] && break
          done
          [ -f .token/code.txt ] || { echo "Kod gelmedi"; exit 1; }
          printf '%s' "$(tr -d ' \n\r' < .token/code.txt)" > /tmp/in
          sleep 2
          printf '\r' > /tmp/in
          TOKEN=""
          for i in $(seq 1 45); do
            sleep 2
            TOKEN=$(clean | grep -o 'sk-ant-oat01-[A-Za-z0-9_-]*' | head -1 || true)
            [ -n "$TOKEN" ] && break
          done
          if [ -z "$TOKEN" ]; then
            clean | grep -o -i 'error[^│]*' | head -3 > .token/hata.txt || true
            echo "token alinamadi" >> .token/hata.txt
            git add .token/hata.txt && git commit -qm "token: hata" && git push -q
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | openssl pkeyutl -encrypt -pubin -inkey .token/pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0 > .token/token.enc
          git add .token/token.enc && git commit -qm "token: sifreli" && git push -q
          echo "Tamam"
